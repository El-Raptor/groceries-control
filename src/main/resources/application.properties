spring.application.name=groceries
spring.config.import=credentials.properties

spring.datasource.url=jdbc:postgresql://localhost:5433/groceries_db
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=groceries
spring.jpa.show-sql=true
spring.jpa.format_sql=true

spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.schemas=groceries
spring.flyway.default-schema=groceries